name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow 설치
        run: python -m pip install --quiet pillow

      # images/ 의 사진을 웹 크기로 줄이고 앨범 목록(album.json)과
      # 카카오톡 카드(og.jpg)를 만듭니다. music/ 의 mp3 도 옮깁니다.
      # 사진은 images/album/ 에 원본, images/thumbnails/ 에 이름 앞에 t 를
      # 붙인 정사각형 썸네일, 순서는 images/s.txt 에 적고 push 하면 끝입니다.
      - name: 사진 준비
        run: python tools/build_media.py

      # 연락처·계좌번호는 레포에 없습니다. 여기서 Secrets 로부터 만들어 넣습니다.
      # 레포 Settings → Secrets and variables → Actions 에 등록하세요.
      - name: 비공개 정보 주입
        run: |
          cat > assets/js/private.js <<'EOF'
          const PRIVATE = {
            account:          '${{ secrets.ACCOUNT }}',
            rsvpEndpoint:     '${{ secrets.RSVP_ENDPOINT }}',
            kakaoJsKey:       '${{ secrets.KAKAO_JS_KEY }}',
          };
          EOF

      # 링크 미리보기(OG) 태그를 content.js 값으로 채우고,
      # CSS·JS 주소에 커밋 번호를 붙입니다.
      # 카카오톡 크롤러는 JS 를 실행하지 않으므로 OG 는 HTML 에 있어야 합니다.
      - name: 페이지 마무리
        run: python tools/build_page.py "${{ github.sha }}" "${{ steps.pages.outputs.base_url }}/"

      # 올릴 필요 없는 것들을 덜어냅니다.
      # 특히 images/ 원본은 한 장에 2MB 라 그대로 두면 낭비입니다.
      - name: 배포에 필요 없는 파일 정리
        run: rm -rf images music tools apps-script .github *.md design-draft.html

      - name: Jekyll 처리 끄기
        run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
